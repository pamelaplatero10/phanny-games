
<main class="pantalla-auth pantalla-auth-registro">

  <a routerLink="/home" class="auth-back-home">
    ← Volver al inicio
  </a>

  <section class="card-auth">

    <div class="card-header-magic">
      <h1>Crear cuenta</h1>
    </div>

    <div class="card-body">

      <form>

        <div class="form-group mb-3">

          <label for="nombre" class="form-label">
            Nombre
          </label>

          <input
            type="text"
            id="nombre"
            name="nombre"
            class="form-control"
            placeholder="Ingresa tu nombre"
          >

        </div>

        <div class="form-group mb-3">

          <label for="correoRegistro" class="form-label">
            Correo electrónico
          </label>

          <input
            type="email"
            id="correoRegistro"
            name="correo"
            class="form-control"
            placeholder="Ingresa tu correo"
          >

        </div>

        <div class="form-group mb-3">

          <label for="contrasenaRegistro" class="form-label">
            Contraseña
          </label>

          <input
            type="password"
            id="contrasenaRegistro"
            name="contrasena"
            class="form-control"
            placeholder="Crea una contraseña"
          >

        </div>

        <div class="form-group mb-3">

          <label for="confirmarContrasena" class="form-label">
            Confirmar contraseña
          </label>

          <input
            type="password"
            id="confirmarContrasena"
            name="confirmarContrasena"
            class="form-control"
            placeholder="Repite tu contraseña"
          >

        </div>

        <div class="form-group mb-4">

          <label class="form-label">
            ¿Cómo deseas participar?
          </label>

          <div class="seleccion-rol">

            <div class="form-check">
              <input
                type="radio"
                id="rolJugador"
                name="rol"
                value="jugador"
                class="form-check-input"
                checked
              >

              <label for="rolJugador" class="form-check-label">
                Jugador
              </label>
            </div>

            <div class="form-check">
              <input
                type="radio"
                id="rolDesarrollador"
                name="rol"
                value="desarrollador"
                class="form-check-input"
              >

              <label for="rolDesarrollador" class="form-check-label">
                Desarrollador
              </label>
            </div>

          </div>

        </div>

        <button type="button" class="btn btn-magic">
          CREAR CUENTA ✦
        </button>

      </form>

      <div class="auth-footer">
        ¿Ya tienes una cuenta?

        <a routerLink="/login" class="auth-link font-weight-bold">
          Inicia sesión
        </a>
      </div>

    </div>

  </section>

</main>
